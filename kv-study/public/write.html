<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>KV Study</title>
		<script type="module" src="./resources/write/index.js"></script>
		<style>
			#kvContent {
				width: 500px;
				height: 200px;
			}
		</style>
	</head>
	<body>
		<h1>Write</h1>
		<a href="../">Home</a>
		<main>
			<section>
				<h2>KVへの登録</h2>
				<div>
					<div>内容：</div>
					<div>
						<textarea id="kvContent"></textarea>
					</div>
				</div>
				<div>
					<div>TTL(s)：</div>
					<div>
						<input id="kvTTLSeconds" type="text" />
					</div>
				</div>

				<div>
					<button id="writeButton">Write</button>
				</div>
			</section>

			<hr />
			<section>
				<h2>KVへの登録結果</h2>
				<div>
					<div>生成されたキー：</div>
					<div id="generatedKey"></div>
				</div>
				<div>
					<button id="toReadPageButton">Read画面へ</button>
				</div>
			</section>
		</main>
	</body>
</html>
